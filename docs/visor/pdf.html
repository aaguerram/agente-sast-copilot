<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor PDF</title>
<!--
  Visor de documentos PDF sin servidor, renderizados con PDF.js (pdf.min.js local).
  No depende del visor integrado del navegador, así que funciona igual en todos.
  Uso desde un .md (ruta del archivo relativa a docs/):
    [Ver documento](../visor/pdf.html?f=datos/documento.pdf){ target=_blank }
  Parámetros: f = archivo (obligatorio), p = página inicial (opcional).
  Teclado: + y - para el zoom, 0 para ajustar al ancho.
-->
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de;
    --head: #f6f8fa; --accent: #4051b5; --hover: #eef1fb; --lienzo: #e9ecf1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e2129; --fg: #e6e6e6; --muted: #9aa0a6; --line: #3a3f4b;
      --head: #262a33; --accent: #8c9eff; --hover: #2c3242; --lienzo: #14161c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; overflow-wrap: anywhere; }
  header .acciones { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .boton {
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: none; color: var(--fg); text-decoration: none; white-space: nowrap;
    font: inherit; cursor: pointer;
  }
  .boton:hover { background: var(--hover); }
  nav {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 6px 16px; border-bottom: 1px solid var(--line); background: var(--head);
    color: var(--muted);
  }
  nav[hidden] { display: none; }
  nav button {
    border: 0; background: none; color: var(--accent); cursor: pointer;
    padding: 6px 10px; font: inherit; font-weight: 600; white-space: nowrap;
  }
  nav #contador, nav #zoom { font-variant-numeric: tabular-nums; min-width: 5em; text-align: center; }
  main { flex: 1; overflow: auto; background: var(--lienzo); padding: 16px; }
  .pagina {
    margin: 0 auto 16px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .pagina canvas { display: block; width: 100%; height: 100%; }
  .mensaje { padding: 24px 16px; color: var(--muted); }
  .error { color: #cf222e; }
  @media (max-width: 600px) {
    header .acciones { margin-left: 0; width: 100%; }
    main { padding: 8px; }
    nav { gap: 4px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="titulo">Visor PDF</h1>
  <div class="acciones">
    <a id="descargar" class="boton" hidden download>Descargar</a>
  </div>
</header>
<nav id="barra" hidden>
  <span id="contador">– / –</span>
  <button id="menos" type="button" aria-label="Reducir zoom">−</button>
  <span id="zoom">100 %</span>
  <button id="mas" type="button" aria-label="Aumentar zoom">+</button>
  <button id="ajustar" type="button">Ajustar al ancho</button>
</nav>
<main id="contenido">
  <p class="mensaje" id="estado">Cargando…</p>
</main>
<script src="pdf.min.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const archivo = params.get("f");
  const contenido = document.getElementById("contenido");
  const estado = document.getElementById("estado");
  const contador = document.getElementById("contador");
  const zoomTexto = document.getElementById("zoom");

  function mensaje(texto, esError) {
    estado.hidden = false;
    estado.className = "mensaje" + (esError ? " error" : "");
    estado.textContent = texto;
  }

  if (!archivo) {
    mensaje("Falta el parámetro ?f= con la ruta del archivo (relativa a docs/).", true);
    return;
  }

  // La ruta se resuelve contra la raíz del sitio (carpeta padre de visor/)
  // y solo se aceptan archivos del mismo origen.
  const raiz = new URL("../", location.href);
  const url = new URL(archivo, raiz);
  if (url.origin !== location.origin) {
    mensaje("Solo se pueden abrir archivos del propio sitio.", true);
    return;
  }

  const nombre = decodeURIComponent(url.pathname.split("/").pop());
  document.title = nombre + " · Visor PDF";
  document.getElementById("titulo").textContent = nombre;
  const descargar = document.getElementById("descargar");
  descargar.href = url.href;
  descargar.hidden = false;

  pdfjsLib.GlobalWorkerOptions.workerSrc = new URL("pdf.worker.min.js", location.href).href;

  let documento = null;
  let paginas = [];        // { div, pdfPage, ancho, alto, render }
  let zoom = null;         // null = ajustar al ancho del espacio disponible
  let observador = null;

  pdfjsLib.getDocument(url.href).promise
    .then(doc => {
      documento = doc;
      const lecturas = [];
      for (let i = 1; i <= doc.numPages; i++) lecturas.push(doc.getPage(i));
      return Promise.all(lecturas);
    })
    .then(lista => {
      estado.hidden = true;
      paginas = lista.map((pdfPage, i) => {
        const vista = pdfPage.getViewport({ scale: 1 });
        const div = document.createElement("div");
        div.className = "pagina";
        div.dataset.numero = String(i + 1);
        contenido.appendChild(div);
        return { div, pdfPage, ancho: vista.width, alto: vista.height, render: null, escala: 0 };
      });
      document.getElementById("barra").hidden = false;
      // las páginas se dibujan solo cuando entran en pantalla
      observador = new IntersectionObserver(entradas => {
        for (const e of entradas) if (e.isIntersecting) dibujar(paginas[+e.target.dataset.numero - 1]);
        actualizarContador();
      }, { root: contenido, rootMargin: "200px 0px" });
      paginas.forEach(p => observador.observe(p.div));
      maquetar();
      const p = parseInt(params.get("p"), 10);
      if (p >= 1 && p <= paginas.length) paginas[p - 1].div.scrollIntoView();
    })
    .catch(e => mensaje(e && e.name === "MissingPDFException"
      ? "No se encontró " + archivo
      : (e.message || String(e)), true));

  // ---- tamaño y dibujo ------------------------------------------------------
  // ajustar al ancho, sin pasar de ANCHO_MAX para que una página vertical se lea entera
  const ANCHO_MAX = 900;
  function escalaActual() {
    if (zoom) return zoom;
    const disponible = contenido.clientWidth - parseFloat(getComputedStyle(contenido).paddingLeft) * 2;
    return Math.max(0.25, Math.min(disponible, ANCHO_MAX) / paginas[0].ancho);
  }

  function maquetar() {
    const escala = escalaActual();
    zoomTexto.textContent = Math.round(escala * 100) + " %";
    for (const p of paginas) {
      p.div.style.width = Math.floor(p.ancho * escala) + "px";
      p.div.style.height = Math.floor(p.alto * escala) + "px";
      if (p.escala !== escala) {
        p.escala = 0; // obliga a redibujar con la nueva escala
        if (enPantalla(p.div)) dibujar(p);
      }
    }
  }

  function enPantalla(div) {
    const r = div.getBoundingClientRect();
    const c = contenido.getBoundingClientRect();
    return r.bottom >= c.top - 200 && r.top <= c.bottom + 200;
  }

  function dibujar(p) {
    const escala = escalaActual();
    if (p.escala === escala) return;
    p.escala = escala;
    if (p.render) p.render.cancel();
    const ratio = window.devicePixelRatio || 1;
    const vista = p.pdfPage.getViewport({ scale: escala * ratio });
    const lienzo = document.createElement("canvas");
    lienzo.width = Math.floor(vista.width);
    lienzo.height = Math.floor(vista.height);
    p.render = p.pdfPage.render({ canvasContext: lienzo.getContext("2d"), viewport: vista });
    p.render.promise
      .then(() => { p.div.replaceChildren(lienzo); p.render = null; })
      .catch(() => {}); // render cancelado por un cambio de zoom
  }

  function actualizarContador() {
    if (!paginas.length) return;
    const c = contenido.getBoundingClientRect();
    const mitad = c.top + c.height / 3;
    let actual = 1;
    for (const p of paginas) {
      if (p.div.getBoundingClientRect().top <= mitad) actual = +p.div.dataset.numero;
    }
    contador.textContent = "Página " + actual + " / " + paginas.length;
  }

  // ---- zoom -----------------------------------------------------------------
  function cambiarZoom(factor) {
    if (!paginas.length) return;
    const relativo = contenido.scrollTop / Math.max(1, contenido.scrollHeight);
    zoom = factor === null ? null : Math.min(4, Math.max(0.25, escalaActual() * factor));
    maquetar();
    contenido.scrollTop = relativo * contenido.scrollHeight;
    actualizarContador();
  }

  document.getElementById("menos").addEventListener("click", () => cambiarZoom(1 / 1.2));
  document.getElementById("mas").addEventListener("click", () => cambiarZoom(1.2));
  document.getElementById("ajustar").addEventListener("click", () => cambiarZoom(null));
  contenido.addEventListener("scroll", actualizarContador, { passive: true });
  window.addEventListener("resize", () => { if (paginas.length && zoom === null) maquetar(); });
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "+" || e.key === "=") cambiarZoom(1.2);
    else if (e.key === "-") cambiarZoom(1 / 1.2);
    else if (e.key === "0") cambiarZoom(null);
  });
})();
</script>
</body>
</html>

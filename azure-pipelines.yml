# Pipeline de seguridad: pre-commit + gitleaks, Semgrep CE y SonarQube Community.
#
# - Corre en cada push a main (trigger de abajo).
# - Corre en cada PULL REQUEST a main mediante la política de rama "Build validation"
#   que crea scripts/ado-bootstrap.sh. En Azure Repos el bloque `pr:` del YAML se ignora:
#   la validación de PR SIEMPRE se configura como política de rama.
# - No usa extensiones del Marketplace, service connections ni servidores externos:
#   se puede replicar en cualquier organización de Azure DevOps (ver docs/pipeline.md).
#
# Variables opcionales del pipeline (Pipelines > Edit > Variables):
#   SONAR_HOST_URL   URL de un SonarQube real. Sin ella se usa un servidor efímero.
#   SONAR_TOKEN      Token de análisis de ese servidor (marcar como secreta).

trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  PYTHON_VERSION: '3.12'
  PRE_COMMIT_VERSION: '4.7.0'
  SEMGREP_VERSION: '1.185.0'
  GITLEAKS_IMAGE: 'ghcr.io/gitleaks/gitleaks:v8.30.1'
  DOTNET_VERSION: '10.0.x'
  REPORTES: '$(Build.ArtifactStagingDirectory)/reportes'

jobs:
  # ------------------------------------------------------------------ pre-commit
  - job: pre_commit
    displayName: pre-commit y secretos
    steps:
      - checkout: self
        fetchDepth: 0          # historial completo para gitleaks
        persistCredentials: false

      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(PYTHON_VERSION)

      - script: |
          set -e
          pip install --quiet pre-commit==$(PRE_COMMIT_VERSION)
          pre-commit run --all-files --show-diff-on-failure
        displayName: pre-commit (todos los archivos)

      - script: python tools/pre-commit-hooks/tests/run_tests.py
        displayName: Pruebas de los hooks .NET propios
        condition: succeededOrFailed()

      # Los .ps1 (soporte Windows) se revisan en el agente Linux con PowerShell 7, que ya
      # trae la imagen hospedada: sintaxis de todos, "-Listar" de validar-local.ps1 y la ayuda de agente.ps1/.sh.
      - pwsh: |
          $errores = 0
          foreach ($f in Get-ChildItem scripts/*.ps1) {
            $tokens = $null; $fallos = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$fallos) | Out-Null
            foreach ($e in $fallos) { Write-Host "##vso[task.logissue type=error;sourcepath=$($f.Name);linenumber=$($e.Extent.StartLineNumber)]$($e.Message)"; $errores++ }
          }
          if ($errores) { exit 1 }
          ./scripts/validar-local.ps1 -Listar
          ./scripts/agente.ps1 ayuda | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bash scripts/agente.sh ayuda > /dev/null
        displayName: Scripts PowerShell (soporte Windows)
        condition: succeededOrFailed()

      # El hook de gitleaks solo mira lo que está en "staging"; en el servidor se
      # revisa además todo el historial de la rama, incluidos los commits del PR.
      - script: |
          set -e
          mkdir -p "$(REPORTES)"
          docker run --rm -v "$(Build.SourcesDirectory)":/repo -v "$(REPORTES)":/reportes \
            $(GITLEAKS_IMAGE) git /repo --config /repo/.gitleaks.toml --redact \
            --report-format sarif --report-path /reportes/gitleaks.sarif
        displayName: gitleaks (historial)
        condition: succeededOrFailed()

      - task: PublishBuildArtifacts@1
        displayName: Publicar reportes
        condition: succeededOrFailed()
        inputs:
          PathtoPublish: $(REPORTES)
          ArtifactName: CodeAnalysisLogs

  # ------------------------------------------------------------------ Semgrep
  - job: semgrep
    displayName: Semgrep CE (SAST)
    steps:
      - checkout: self
        persistCredentials: false

      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(PYTHON_VERSION)

      - script: pip install --quiet semgrep==$(SEMGREP_VERSION)
        displayName: Instalar Semgrep CE

      # Bloqueante: reglas del registro + reglas propias de .semgrep/
      - script: |
          set -e
          mkdir -p "$(REPORTES)"
          semgrep scan --config p/default --config p/csharp --config p/secrets \
            --config .semgrep/ --metrics=off \
            --sarif --output "$(REPORTES)/semgrep.sarif" --error .
        displayName: Semgrep (bloquea si hay hallazgos)

      # Informativo: reporte CON hallazgos sobre la muestra vulnerable, ya normalizado,
      # como entrada de demo para los agentes de agente-sast-g7/.
      - script: |
          mkdir -p "$(REPORTES)"
          semgrep scan --config p/csharp --config p/secrets --metrics=off \
            --sarif --output "$(REPORTES)/semgrep-muestras.sarif" \
            agente-sast-g7/samples/codigo-dotnet/VulnerableController.cs
          python3 agente-sast-g7/scripts/normalizar_sarif.py \
            "$(REPORTES)/semgrep-muestras.sarif" -o "$(REPORTES)/muestras-normalizado.json"
        displayName: Reporte de demo sobre la muestra vulnerable (no bloquea)
        condition: succeededOrFailed()
        continueOnError: true

      # Bloqueante: pruebas del apoyo determinista de la metodología SAST (no del código
      # analizado). Informativo: candidatos sobre la app vulnerable para los agentes.
      - script: python3 agente-sast-g7/scripts/tests/test_metodologia.py
        displayName: Pruebas de la metodología SAST (metodologia.py)
        condition: succeededOrFailed()

      - script: |
          python3 agente-sast-g7/scripts/metodologia.py todo agente-sast-g7/samples/app-vulnerable \
            --dir "$(REPORTES)/metodologia"
        displayName: Candidatos de la metodología sobre app-vulnerable (no bloquea)
        condition: succeededOrFailed()
        continueOnError: true

      - task: PublishBuildArtifacts@1
        displayName: Publicar reportes
        condition: succeededOrFailed()
        inputs:
          PathtoPublish: $(REPORTES)
          ArtifactName: CodeAnalysisLogs

  # ------------------------------------------------------------------ SonarQube
  - job: sonarqube
    displayName: SonarQube Community
    timeoutInMinutes: 30
    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: false

      - task: UseDotNet@2
        displayName: .NET 10
        inputs:
          packageType: sdk
          version: $(DOTNET_VERSION)

      - script: |
          # Requisito de Elasticsearch (embebido en SonarQube) en el host del agente.
          sudo sysctl -w vm.max_map_count=524288 || true
          # Una variable no definida llega como el texto literal "$(NOMBRE)": se descarta.
          case "${SONAR_HOST_URL:-}" in '$('*) unset SONAR_HOST_URL ;; esac
          case "${SONAR_TOKEN:-}" in '$('*) unset SONAR_TOKEN ;; esac
          REPORTES_DIR="$(REPORTES)" ./scripts/sonar-analizar.sh
        displayName: Analizar con SonarQube
        env:
          SONAR_HOST_URL: $(SONAR_HOST_URL)
          SONAR_TOKEN: $(SONAR_TOKEN)

      - task: PublishBuildArtifacts@1
        displayName: Publicar reportes
        condition: succeededOrFailed()
        inputs:
          PathtoPublish: $(REPORTES)
          ArtifactName: CodeAnalysisLogs
